services:
  # 1. 員工打卡系統的 MySQL 資料庫 (對外 Port: 3311)
  punch_db:
    image: mysql:8.0
    container_name: punch_mysql
    restart: "no"
    environment:
      TZ: ${SYSTEM_TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS}
      MYSQL_DATABASE: ${MYSQL_DB_NAME}
    ports:
      - "${DB_PORT_EXTERNAL}:3306" # 讀取 .env，完美對齊你的 "3311:3306"
    volumes:
      - punch_db_data:/var/lib/mysql
    # 🎯 智慧型健康檢查：每 5 秒探測一次 MySQL 核心是否真正 Ready
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. 打卡系統的 Node.js 後端服務
  punch_backend:
    build: .
    container_name: punch_web_service
    restart: "no"
    ports:
      - "${APP_PORT_EXTERNAL}:3001"
    environment:
      TZ: ${SYSTEM_TZ}
      NODE_ENV: production
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASS}@punch_db:3306/${MYSQL_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    # 🔗 嚴格依賴鏈：確保 punch_db 的 healthcheck 狀態為 healthy，後端才會正式啟動
    depends_on:
      punch_db:
        condition: service_healthy

volumes:
  punch_db_data: