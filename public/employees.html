<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>車庫小籠包 - 員工管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand"><img class="brand-logo" data-logo src="/img/logo.jpg" alt="" width="32" height="32">員工管理</div>
        <div class="topbar-user">
            <a class="btn btn-ghost" href="/qrcode.html">打卡 QR Code</a>
            <a class="btn btn-ghost" href="/">回首頁</a>
            <button id="logout-btn" class="btn btn-ghost" type="button">登出</button>
        </div>
    </header>

    <main class="container wide">
        <div id="message" class="result" role="status" aria-live="polite" hidden></div>

        <!-- 新增員工 -->
        <section class="card">
            <h2>新增員工</h2>
            <p class="subtitle">員工不需要帳號密碼，只需要姓名和時薪。</p>
            <form id="add-form" class="form-grid">
                <div class="field">
                    <label for="add-name">姓名</label>
                    <input type="text" id="add-name" required autocomplete="off">
                </div>
                <div class="field">
                    <label for="add-rate">時薪（元）</label>
                    <input type="number" id="add-rate" required min="0" step="1" inputmode="numeric" placeholder="例如 190">
                </div>
                <div class="field">
                    <label for="add-role">身分</label>
                    <select id="add-role">
                        <option value="EMPLOYEE">員工（選名字打卡）</option>
                        <option value="ADMIN">管理員（可進後台）</option>
                    </select>
                </div>
                <div class="field" id="admin-username-field" hidden>
                    <label for="add-username">後台登入帳號</label>
                    <input type="text" id="add-username" minlength="3" autocomplete="off" autocapitalize="none">
                </div>
                <div class="field" id="admin-password-field" hidden>
                    <label for="add-password">後台登入密碼</label>
                    <input type="text" id="add-password" minlength="6" autocomplete="off" autocapitalize="none">
                    <span class="hint">至少 6 個字元</span>
                </div>
                <div class="form-actions">
                    <button id="add-btn" type="submit" class="btn btn-primary">新增</button>
                </div>
            </form>
        </section>

        <!-- 修改員工 -->
        <section id="edit-card" class="card" hidden>
            <h2>修改員工：<span id="edit-title"></span></h2>
            <form id="edit-form" class="form-grid">
                <div class="field">
                    <label for="edit-name">姓名</label>
                    <input type="text" id="edit-name" required autocomplete="off">
                </div>
                <div class="field">
                    <label for="edit-rate">時薪（元）</label>
                    <input type="number" id="edit-rate" required min="0" step="1" inputmode="numeric">
                </div>
                <div class="form-actions">
                    <button id="edit-save" type="submit" class="btn btn-primary">儲存</button>
                    <button id="edit-cancel" type="button" class="btn btn-ghost">取消</button>
                </div>
            </form>
            <p class="hint">調整時薪後，重新計算任何月份都會用新的時薪。</p>
        </section>

        <!-- 員工名單 -->
        <section class="card">
            <h2>員工名單</h2>
            <p class="subtitle">離職的員工請按「停用」：他們會從打卡名單消失，但過去的打卡和薪資紀錄會保留。</p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>身分</th>
                            <th class="num">時薪</th>
                            <th>狀態</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="employee-tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/employees.js"></script>
</body>
</html>
