<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點心專賣店 - 人資系統</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Login View -->
    <div id="login-view" class="view active">
        <div class="glass-card login-card">
            <div class="logo">🥟</div>
            <h1>登入系統</h1>
            <p>歡迎回到點心專賣店人資管理</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">帳號</label>
                    <input type="text" id="username" required placeholder="請輸入帳號 (預設: admin)">
                </div>
                <div class="input-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" required placeholder="請輸入密碼 (預設: admin123)">
                </div>
                <button type="submit" class="btn-primary">登入</button>
            </form>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="view">
        <nav class="glass-nav">
            <div class="nav-brand">🥟 點心專賣店 HR</div>
            <div class="nav-user">
                <span id="user-name-display">使用者</span>
                <button id="logout-btn" class="btn-outline">登出</button>
            </div>
        </nav>

        <main class="dashboard-container">
            <!-- Clock Action Card -->
            <section class="glass-card dashboard-card">
                <h2>📍 今日打卡</h2>
                <div class="clock-actions">
                    <button class="btn-primary btn-large clock-btn" data-type="in">☀️ 上班打卡</button>
                    <button class="btn-secondary btn-large clock-btn" data-type="out">🌙 下班打卡</button>
                </div>
                <div class="ai-recognition">
                    <button id="ai-recognize-btn" class="btn-outline">🤖 啟動 AI 視覺打卡 (測試)</button>
                </div>
            </section>

            <!-- Admin Only: Today's Attendance -->
            <section id="admin-section" class="glass-card dashboard-card hidden">
                <h2>📋 今日出勤總覽 (老闆專用)</h2>
                <div class="table-container">
                    <table class="glass-table">
                        <thead>
                            <tr>
                                <th>姓名</th>
                                <th>出勤類型</th>
                                <th>上班時間</th>
                                <th>下班時間</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-tbody">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
