<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>車庫小籠包 - 員工登記 QR Code</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand"><img class="brand-logo" data-logo src="/img/logo.jpg" alt="" width="32" height="32">員工登記</div>
        <div class="topbar-user">
            <a class="btn btn-ghost" href="/">回首頁</a>
            <button id="logout-btn" class="btn btn-ghost" type="button">登出</button>
        </div>
    </header>

    <main class="container wide">
        <div id="message" class="result" role="status" aria-live="polite" hidden></div>

        <section class="card">
            <h2>登記員工的手機</h2>
            <p class="subtitle">新員工第一次打卡時，要先登記手機。這裡產生的 QR Code <strong>只有一小段時間有效、用完就失效</strong>，所以就算被拍照也沒有用。每支手機只要登記一次。</p>

            <div class="toolbar">
                <div class="field">
                    <label for="ttl-select">有效時間</label>
                    <select id="ttl-select">
                        <option value="5">5 分鐘</option>
                        <option value="10" selected>10 分鐘</option>
                        <option value="30">30 分鐘（用 LINE 傳連結時）</option>
                    </select>
                </div>
                <div class="field">
                    <label for="uses-select">可登記幾支手機</label>
                    <select id="uses-select">
                        <option value="1">1 支</option>
                        <option value="3" selected>3 支</option>
                        <option value="5">5 支</option>
                        <option value="10">10 支</option>
                    </select>
                </div>
                <button id="qr-create" type="button" class="btn btn-primary">產生 QR Code</button>
            </div>
        </section>

        <section id="qr-card" class="card" hidden>
            <div class="qr-box">
                <div id="qr-state" class="qr-state"></div>
                <img id="qr-img" alt="員工登記 QR Code">
                <div id="qr-countdown" class="qr-countdown"></div>
                <div id="qr-uses" class="qr-note"></div>

                <div class="qr-note">掃不到時，可在打卡頁手動輸入通行碼：</div>
                <div id="qr-code" class="qr-code-text"></div>

                <div class="form-actions" style="justify-content:center">
                    <button id="qr-share" type="button" class="btn btn-primary" hidden>用 LINE 傳給員工</button>
                    <button id="qr-copy" type="button" class="btn btn-ghost">複製連結</button>
                </div>
                <p class="hint">連結和 QR Code 的效果一樣，點了就能登記手機。時間到或名額用完就會失效。</p>
            </div>
        </section>

        <section class="card">
            <h2>已登記的手機</h2>
            <p class="subtitle">員工離職、或手機遺失時，按下面的按鈕讓<strong>所有</strong>已登記的手機失效。留下來的員工需要再登記一次（重新產生 QR Code 掃描即可）。</p>
            <button id="revoke-all" type="button" class="btn btn-ghost">讓所有已登記的手機失效</button>
        </section>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/qrcode.js"></script>
</body>
</html>
