<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>車庫小籠包 - 薪資核算</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand"><img class="brand-logo" data-logo src="/img/logo.jpg" alt="" width="32" height="32">薪資核算</div>
        <div class="topbar-user">
            <a class="btn btn-ghost" href="/attendance.html">補打卡</a>
            <a class="btn btn-ghost" href="/employees.html">員工管理</a>
            <a class="btn btn-ghost" href="/">回打卡頁</a>
            <button id="logout-btn" class="btn btn-ghost" type="button">登出</button>
        </div>
    </header>

    <main class="container wide">
        <section class="card">
            <div class="toolbar">
                <div class="field">
                    <label for="month-input">查詢月份</label>
                    <input type="month" id="month-input">
                </div>
                <button id="calc-btn" class="btn btn-primary" type="button">計算薪資</button>
            </div>
            <div id="salary-error" class="result error" role="alert" hidden></div>
        </section>

        <section id="result-card" class="card" hidden>
            <h2 id="result-title">本月薪資</h2>
            <p class="subtitle">只計入已完成上下班打卡的紀錄；加班與正常班一律按時薪 × 工時計算。整天沒有打卡的日子（不含今天）列為休假。</p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>員工</th>
                            <th class="num">時薪</th>
                            <th class="num">總工時</th>
                            <th class="num">休假天數</th>
                            <th class="num">應發薪資</th>
                        </tr>
                    </thead>
                    <tbody id="salary-tbody"></tbody>
                    <tfoot id="salary-tfoot"></tfoot>
                </table>
            </div>

            <details>
                <summary>查看每日明細</summary>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>姓名</th>
                                <th>類型</th>
                                <th>上班</th>
                                <th>下班</th>
                                <th class="num">工時</th>
                                <th class="num">金額</th>
                            </tr>
                        </thead>
                        <tbody id="detail-tbody"></tbody>
                    </table>
                </div>
            </details>
        </section>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/boss.js"></script>
</body>
</html>
