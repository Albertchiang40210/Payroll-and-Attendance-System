name: CI Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: punch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_password"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DATABASE_URL: mysql://root:ci_password@127.0.0.1:3306/punch_test
      JWT_SECRET: ci-test-secret

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client & push schema
      run: |
        npx prisma generate
        npx prisma db push

    - name: Run Tests
      run: npm test

  # ---------- CD：測試通過後，建置正式映像檔並推到 GHCR ----------
  # 只在 push 到 main 時執行（PR 只跑測試，不發佈映像檔）
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 允許用內建 GITHUB_TOKEN 推映像檔到 GHCR

    steps:
    - uses: actions/checkout@v4

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 自動產生 tag：sha-<commit> 供回滾用，latest 指向最新版（映像名稱會自動轉小寫）
    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha,prefix=sha-
          type=raw,value=latest

    - uses: docker/setup-buildx-action@v3

    - name: Build and push (prod target)
      uses: docker/build-push-action@v6
      with:
        context: .
        target: prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
