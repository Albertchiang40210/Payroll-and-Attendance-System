name: CI Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: punch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_password"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DATABASE_URL: mysql://root:ci_password@127.0.0.1:3306/punch_test
      JWT_SECRET: ci-test-secret

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client & push schema
      run: |
        npx prisma generate
        npx prisma db push

    - name: Run Tests
      run: npm test
